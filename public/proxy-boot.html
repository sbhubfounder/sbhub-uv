<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title></title><style>html,body{margin:0;height:100%;background:#070c18}</style></head><body>
<script>
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){rej(new Error(src))};document.head.appendChild(s);});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function encodeUrl(url){
  try{if(self.__uv$config&&self.__uv$config.encodeUrl)return self.__uv$config.encodeUrl(url);}catch(e){}
  var out="";for(var i=0;i<url.length;i++)out+=i%2?String.fromCharCode(url.charCodeAt(i)^2):url[i];return out;
}
(async function(){
  var params=new URLSearchParams(location.search);
  var target=params.get("url");
  var phase=Number(params.get("_p")||"0");
  if(!target||!/^https?:\/\//i.test(target))return;
  try{
    await loadScript("/baremux/index.js");
    await loadScript("/uv/uv.bundle.js");
    await loadScript("/uv/uv.config.js");
    var reg=await navigator.serviceWorker.register("/sw.js",{scope:"/"});
    await navigator.serviceWorker.ready;
    if(reg.waiting)try{reg.waiting.postMessage({type:"SKIP_WAITING"});}catch(e){}
    if(reg.active)try{reg.active.postMessage({type:"claim"});}catch(e){}
    if(!navigator.serviceWorker.controller&&phase<2){
      var u=new URL(location.href);u.searchParams.set("_p",String(phase+1));
      await wait(400);location.replace(u.href);return;
    }
    try{
      if(typeof BareMux!=="undefined"&&BareMux.BareMuxConnection){
        var conn=new BareMux.BareMuxConnection("/baremux/worker.js");
        var wisp=(location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/wisp/";
        await conn.setTransport("/epoxy/index.mjs",[{wisp:wisp}]);
        await wait(100);
      }
    }catch(e){}
    var prefix=(self.__uv$config&&self.__uv$config.prefix)||"/uv/service/";
    location.replace(prefix+encodeUrl(target));
  }catch(e){}
})();
</script></body></html>
